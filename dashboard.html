<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Stok Buah</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #007bff; color: white; }
        .form-input { margin-bottom: 20px; display: flex; gap: 10px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; flex: 1; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Manajemen Stok Buah</h2>
        <div class="form-input">
            <input type="text" id="nama" placeholder="Nama Buah">
            <input type="number" id="stok" placeholder="Stok">
            <input type="number" id="harga" placeholder="Harga">
            <button onclick="tambahBuah()">Tambah</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Stok</th>
                    <th>Harga</th>
                </tr>
            </thead>
            <tbody id="tabel-buah"></tbody>
        </table>
    </div>

    <script>
        // GUNAKAN LINK NGROK YANG SAMA DENGAN INDEX.HTML
        const API_URL = "https://reece-unanachronistic-kaysen.ngrok-free.dev"; 

        async function muatData() {
            try {
                const res = await fetch(`${API_URL}/buah`);
                const data = await res.json();
                const tabel = document.getElementById('tabel-buah');
                tabel.innerHTML = '';
                data.forEach(b => {
                    tabel.innerHTML += `<tr><td>${b.nama}</td><td>${b.stok}</td><td>Rp ${b.harga}</td></tr>`;
                });
            } catch (err) {
                console.error("Gagal muat data", err);
            }
        }

        async function tambahBuah() {
            const nama = document.getElementById('nama').value;
            const stok = document.getElementById('stok').value;
            const harga = document.getElementById('harga').value;

            try {
                const res = await fetch(`${API_URL}/buah`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ nama, stok, harga })
                });
                const data = await res.json();
                if (res.ok) {
                    Swal.fire('Berhasil', data.message, 'success');
                    muatData();
                } else {
                    Swal.fire('Gagal', data.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Gagal menyambung ke API', 'error');
            }
        }

        muatData();
    </script>
</body>
</html>
